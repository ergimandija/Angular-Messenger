<div class="login-container">
  <p class="title">Login</p>

  <div class="login-box">
    <input [(ngModel)]="username" placeholder="Username" />
    <input [(ngModel)]="password" type="password" placeholder="Password" />

    <button (click)="login()" class="login-btn">
      Login
    </button>
  </div>
</div>
