  @if (errorMessage()) {
    <div>
      {{ errorMessage() }}
    </div>
  }

  @if(isLoading()){
    <div>...Loading</div>
  }
<div class="chat">
  @for(msg of messages(); track msg.senderId) {
    <div class="message">
      <strong class="sender">{{ msg.senderId }}</strong>
      <span class="content">{{ msg.message }}</span>
    </div>
  }
</div>
